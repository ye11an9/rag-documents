[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service-rag"
version = "1.0.0"
description = "상명대 계절학기 프로그램 AI 서비스 실무 개발 과정"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.2.0",
    "langchain-openai>=1.1.0",
    "langchain-core>=1.2.0",
    "langchain-community>=0.4.0",
    "langgraph-cli[inmem]>=0.4.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.12.0",
    "langchain-mcp-adapters>=0.2.0",
    "langchain-qdrant>=0.3.0",
    "PyMuPDF>=1.27.0",
    "qdrant-client>=1.11.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.0.0",
    "streamlit>=1.40.0",
    "supabase>=2.31.0"
]

[tool.setuptools.packages.find]
where = ["src"]
