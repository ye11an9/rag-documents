[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "security-vulnerability-rag"
version = "0.1.0"
description = "Parent-document RAG over CVE, CWE, CVSS, NIST, and vulnerability-response PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipython>=8.30",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-qdrant>=1.1",
    "langchain-text-splitters>=1.0",
    "pymupdf>=1.25",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
]

[tool.setuptools]
py-modules = []
